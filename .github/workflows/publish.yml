# Hourly Threads publisher: posts the next approved post per account from the queue the daily
# Claude run (docs/AGENT_RUN.md) writes. No model runs here; it is `meta publish` only.
# Tokens come from repo secrets (set them with `meta push-secrets` from the local machine).
name: publish

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Write .env from secrets
        env:
          A_TOKEN: ${{ secrets.THREADS_A_TOKEN }}
          A_USER: ${{ secrets.THREADS_A_USER_ID }}
          B_TOKEN: ${{ secrets.THREADS_B_TOKEN }}
          B_USER: ${{ secrets.THREADS_B_USER_ID }}
        run: |
          umask 077
          printf 'THREADS_A_TOKEN=%s\nTHREADS_A_USER_ID=%s\nTHREADS_B_TOKEN=%s\nTHREADS_B_USER_ID=%s\n' \
            "$A_TOKEN" "$A_USER" "$B_TOKEN" "$B_USER" > .env
      - run: meta publish
      - name: Commit publish events
        if: always()
        run: |
          rm -f .env
          git config user.name "meta-publisher"
          git config user.email "meta-publisher@users.noreply.github.com"
          git checkout -- data/posts.jsonl   # only events.jsonl is ours to commit (append-only, merge=union)
          git add data/events.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "publish $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
