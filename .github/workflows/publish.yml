# Hourly Threads publisher: posts the next approved post per account from the queue the daily
# Claude run (docs/AGENT_RUN.md) writes. No model runs here; it is `meta publish` only.
# Tokens come from repo secrets (set them with `meta push-secrets` from the local machine).
#
# Self-chaining: GitHub's cron never fired for this repo (zero scheduled runs 04:46-10:18Z on 27 Nov),
# so each run first queues the next run, then publishes, then waits ~55 minutes. The queued run starts
# when this one ends (concurrency group), so the chain keeps going even if a publish step fails.
# The repo is public, so these long runs cost no Actions minutes. Stop the chain:
# `gh workflow disable publish.yml`; restart it: `gh workflow enable publish.yml` + `gh workflow run publish.yml`.
name: publish

on:
  schedule:
    - cron: "7 */3 * * *"   # backup restarter only, in case the chain ever breaks and cron does fire
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write            # GITHUB_TOKEN may start workflow_dispatch runs (the one event it can trigger)

concurrency:
  group: publish
  cancel-in-progress: false  # one run at a time, one queued; a newer queued run replaces an older one

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0; sleep 15; done
          exit 1
      # ref: main, not the dispatch-time commit: this run starts ~an hour after it was queued, and the
      # previous run's publish events were pushed in between
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Write .env from secrets
        env:
          A_TOKEN: ${{ secrets.THREADS_A_TOKEN }}
          A_USER: ${{ secrets.THREADS_A_USER_ID }}
          B_TOKEN: ${{ secrets.THREADS_B_TOKEN }}
          B_USER: ${{ secrets.THREADS_B_USER_ID }}
        run: |
          umask 077
          printf 'THREADS_A_TOKEN=%s\nTHREADS_A_USER_ID=%s\nTHREADS_B_TOKEN=%s\nTHREADS_B_USER_ID=%s\n' \
            "$A_TOKEN" "$A_USER" "$B_TOKEN" "$B_USER" > .env
      # 50-min gap per account: an early or extra run (manual, cron) never posts twice in an hour
      - run: meta publish --min-gap 50
      - name: Commit publish events
        if: always()
        run: |
          rm -f .env
          git config user.name "meta-publisher"
          git config user.email "meta-publisher@users.noreply.github.com"
          git checkout -- data/posts.jsonl   # only events.jsonl is ours to commit (append-only, merge=union)
          git add data/events.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "publish $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
      - name: Wait for the next hour
        if: always()
        run: sleep 3300
