name: pipeline

# Optional API-key backend (llm.backend: api). The default backend is a scheduled
# Claude Code task on the Claude subscription (docs/AGENT_RUN.md), so this only
# runs when triggered by hand.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "scout | run | track"
        default: run

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: scout
        if: inputs.task == 'scout'
        run: medium scout
      - name: prepare stories up to the human gate
        if: inputs.task == 'run'
        run: medium run --all
      - name: track + learn from your rewrites
        if: inputs.task == 'track'
        run: |
          medium track
          medium learn
      - name: commit results
        run: |
          git config user.name "medium-engine"
          git config user.email "actions@users.noreply.github.com"
          git add stories data/ideas.jsonl data/performance.json config/style-learned.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "pipeline: $(date -u +%F) ${{ inputs.task || 'scheduled' }}"
          git push
