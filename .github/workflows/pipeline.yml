name: pipeline

on:
  schedule:
    - cron: "0 22 * * 0"   # scout: Mondays 06:00 SGT
    - cron: "0 23 * * *"   # prepare stories + track: daily 07:00 SGT
  workflow_dispatch:
    inputs:
      task:
        description: "scout | run | track"
        default: run

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: scout
        if: github.event.schedule == '0 22 * * 0' || inputs.task == 'scout'
        run: medium scout
      - name: prepare stories up to the human gate
        if: github.event.schedule == '0 23 * * *' || inputs.task == 'run'
        run: medium run --all
      - name: track
        if: github.event.schedule == '0 23 * * *' || inputs.task == 'track'
        run: medium track
      - name: commit results
        run: |
          git config user.name "medium-engine"
          git config user.email "actions@users.noreply.github.com"
          git add stories data/ideas.jsonl data/performance.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "pipeline: $(date -u +%F) ${{ inputs.task || 'scheduled' }}"
          git push
