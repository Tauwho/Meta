# Meta engine settings. Every stage reads this; edit by hand, never during an agent run.

accounts:
  A:
    handle: goycoon
    active: true
    persona: >
      Love and relationships. A warm, witty Vietnamese account about yêu đương: dating,
      crushes, couples, breakups, marriage, situationships, red/green flags, love languages,
      and the celebrity couples, viral love stories and relationship debates Vietnam is
      talking about today. Every post finds the love angle in a trend and asks a question
      anyone can answer from their own heart ("bạn sẽ làm gì?", "team nào?").
      Voice: young, relatable, a little cheeky, kind; teases situations, never people.
      Speaks as "tui", calls readers "mấy bà", "mng", "chị em"; Southern-leaning casual (nha, á, hông, nè).
      Favourite formats: caption + card, quote line, ask the crowd, relatable moment; news at most 1 in 4.
      Not about: cheating exposés of private people, sexual content, abuse or tragedy.
    location: Ho Chi Minh City   # tagged on every post once Meta approves threads_location_tagging
    search_keywords: [người yêu, crush, yêu xa, mập mờ]   # popular Threads posts to quote (needs threads_keyword_search approval)
    feeds:
      - https://dantri.com.vn/rss/tinh-yeu-gioi-tinh.rss
      - https://kenh14.vn/rss/doi-song.rss
      - https://kenh14.vn/rss/star.rss
      - https://vnexpress.net/rss/doi-song.rss
      - https://vnexpress.net/rss/giai-tri.rss
  B:
    handle: comtumb
    active: true      # turned on 2026-11-26 at user request (no warm-up); needs `meta auth B`
    persona: >
      Tech and AI. A sharp Vietnamese account that explains today's tech and AI news in plain
      words: new AI models and tools, phones and gadgets, big-tech moves, AI in daily life and
      work, scams and safety tips. Every post says what happened, why a normal Vietnamese
      person should care, and asks for their take. Voice: curious, clear, a little nerdy,
      never hype; no investment calls on tech stocks or crypto.
      Speaks as "mình", calls readers "ae", "mng", "mấy bạn"; neutral casual (nha, á, nè).
      Favourite formats: useful list ("task nào tool nấy", step plans), practical tip, hot take on AI news,
      ask the crowd ("mng dùng AI để làm gì nhiều nhất"). Never sells accounts, keys or "prompt packs".
    location: Ho Chi Minh City
    search_keywords: [AI, ChatGPT, Gemini, điện thoại]
    feeds:
      - https://vnexpress.net/rss/so-hoa.rss
      - https://genk.vn/rss/ai.rss
      - https://genk.vn/rss/home.rss
      - https://tinhte.vn/rss

cadence:
  queue_target: 24         # one daily run fills a day of posts per account (pending + approved)
  write_batch: 6           # drafts per write job
  min_gap_minutes: 30      # between two posts on one account; the hourly cloud cron can start late
  post_hours_vn: [0, 24]   # 24/7 at user request; publish window in Vietnam time (UTC+7)
  max_age_hours: 36        # trend posts older than this are expired instead of published
  max_jobs_per_run: 30     # the daily run stops after this many agent jobs

publish:
  require_approval: false   # true: you run `meta approve`; false: reviewed posts go out on their own

review:
  min_score: 7             # 1-10; below this the post is rejected

track:
  days: 14                 # pull insights for posts published in the last N days

trends:
  google_trends: https://trends.google.com/trending/rss?geo=VN
  feeds:                   # shared by every account; each account adds its own `feeds`
    - https://vnexpress.net/rss/tin-noi-bat.rss
    - https://kenh14.vn/rss/home.rss
  per_feed: 8
